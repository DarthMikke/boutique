# yaml-language-server: $schema=../github-workflow.schema.json
name: Test, build and publish

on:
  push:
    branches:
      - cicd
    tags:
      - "*"
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
      options: --dns 100.100.100.100
    steps:
      - name: Install Git
        run: apt install git
      - name: Configure access to private repos
        run: |
          git config --global credential.helper store
          echo "https://$GH_USER:$GH_TOKEN@github.com" > ~/.git-credentials
      - name: Checkout the repo
        run: |
          echo Checking out to $(pwd)
          set -x
          URL=$(echo ${{gitea.server_url}} | sed 's/:\/\//:\/\/oauth:${{gitea.token}}@/')
          git clone --depth=1 $URL/${{gitea.repository}} boutique
          cd boutique
          git fetch
          git checkout ${{gitea.ref}}
          git submodule update --init --recursive
      - name: Install Docker
        run: |
          apt-get update
          apt-get install -y ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          # Add the repository to Apt sources:
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
            tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update
          apt-get install -y docker-ce-cli docker-buildx-plugin docker-compose-plugin
      - name: Build and publish the image
        run: |
          cd boutique
          chmod +x tools/*.sh
          tools/build.sh
